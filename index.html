<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pine Vault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Pine <span>Vault</span></h1>
  <span id="auto-badge" class="badge" hidden>Auto-paste on</span>
  <button id="us" title="Install with Tampermonkey or Violentmonkey">Enable one-click</button>
  <button id="exp">Export</button>
  <button id="imp">Import</button>
  <input type="file" id="file" accept=".json" hidden>
  <button class="primary" id="new">+ New indicator</button>
</header>

<div id="banner" class="banner" hidden>
  <div>
    <b>Turn on one-click auto-paste.</b>
    Install the tiny helper (Tampermonkey / Violentmonkey), then <b>reload this page</b>.
    After that, <b>Open in TradingView</b> opens the Pine Editor, pastes your code and clicks <b>Add to chart</b> for you.
  </div>
  <div class="banner-actions">
    <button class="primary" id="banner-install">Install helper</button>
    <button id="banner-dismiss">Dismiss</button>
  </div>
</div>

<main>
  <aside>
    <input id="q" placeholder="Search name or tag…" aria-label="Search indicators">
    <div id="list"></div>
  </aside>
  <section class="panel" id="view"></section>
</main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
